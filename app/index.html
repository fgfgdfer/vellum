<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' data: blob:">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Vellum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Open+Sans:ital,wdth,wght@0,75..100,300..800;1,75..100,300..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&family=Heebo:wght@100..900&family=Rubik:ital,wght@0,300..900;1,300..900&family=Assistant:wght@200..800&family=Noto+Sans+Hebrew:wdth,wght@62.5..100,100..900&family=Frank+Ruhl+Libre:wght@300..900&family=Secular+One&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Oswald:wght@200..700&family=Space+Grotesk:wght@300..700&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap">
<style>
/* Layout: file browser home (projects sidebar + file grid), then editor = left panel (file, pages, layers) | canvas with floating bottom toolbar | right inspector. Light by default, dark follows the computer. */
:root{
  --panel:#ffffff; --panel2:#f5f5f5; --hover:#f0f0f0; --line:#e6e6e6; --fg:#1e1e1e; --fg2:#5c5c5c; --mute:#6e6e6e;
  --accent:#0a7cd6; --accentw:#e5f4ff; --onaccent:#ffffff; --comp:#9747ff; --compw:#f1e9ff; --dev:#14ae5c; --danger:#f24822;
  --canvas:#f5f5f5; --dot:#0000001a; --shadow:0 2px 6px #0000000f,0 8px 28px #0000001f; --ui:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#2c2c2c;--panel2:#383838;--hover:#3a3a3a;--line:#444444;--fg:#ffffff;--fg2:#c7c7c7;--mute:#9b9b9b;--accent:#0c8ce9;--accentw:#0c8ce93a;--comp:#a970ff;--compw:#a970ff33;--canvas:#1e1e1e;--dot:#ffffff1c;--shadow:0 2px 6px #0006,0 8px 28px #0008;color-scheme:dark}}
:root[data-theme="dark"]{--panel:#2c2c2c;--panel2:#383838;--hover:#3a3a3a;--line:#444444;--fg:#ffffff;--fg2:#c7c7c7;--mute:#9b9b9b;--accent:#0c8ce9;--accentw:#0c8ce93a;--comp:#a970ff;--compw:#a970ff33;--canvas:#1e1e1e;--dot:#ffffff1c;--shadow:0 2px 6px #0006,0 8px 28px #0008;color-scheme:dark}
html,body{height:100%;background:var(--panel);color:var(--fg);font:11px/16px var(--ui);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ib{background:none;border:0;border-radius:5px;height:24px;min-width:24px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--fg);white-space:nowrap}
.ib:hover{background:var(--hover)}
.ib svg,.dock svg,.lyr svg,#hnav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round;flex:none}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:5px;height:24px;padding:0 8px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:500}
.btn.pri:hover{filter:brightness(1.07)}
.btn.big{height:32px;padding:0 12px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:default}
.sp{flex:1}
.hint{color:var(--mute)}
.k{color:var(--mute)}
:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
/* home */
#shell{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
#tabbar{grid-row:1}#home,#editor{grid-row:2;min-height:0}
#tabbar{display:flex;height:36px;align-items:stretch;background:#1e1e1e;color:#fff;overflow-x:auto;scrollbar-width:none;padding-left:max(0px,env(safe-area-inset-left,0px))}
#tabbar::-webkit-scrollbar{display:none}
#tabbar button{background:none;border:0;color:#ffffffb3;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;font-size:11px;max-width:190px;border-right:1px solid #ffffff14;white-space:nowrap;flex:none}
#tabbar button .t{overflow:hidden;text-overflow:ellipsis}
#tabbar button.on{background:var(--panel);color:var(--fg)}
#tabbar button:hover:not(.on){background:#2c2c2c;color:#fff}
#tabbar .x{opacity:0;width:16px;height:16px;border-radius:3px;display:grid;place-items:center;font-size:12px}
#tabbar button:hover .x,#tabbar button.on .x{opacity:.65}
#tabbar .x:hover{background:#8884;opacity:1}
#tabbar .home{padding:0 14px}
#tabbar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4}
#home{display:grid;grid-template-columns:248px 1fr;background:var(--panel);min-height:0}
#hacct{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-weight:600;font-size:13px}
#hacct:hover{background:var(--hover)}
#hacct .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:12px;flex:none}
#hsearch{width:100%;height:32px;border:1px solid transparent;background:var(--panel2);border-radius:6px;padding:0 10px;outline:0}
#hsearch:focus{border-color:var(--accent)}
.hdiv{border-top:1px solid var(--line);margin:8px 0}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tools .f{height:28px}
.ficon{width:18px;height:18px;border-radius:4px;background:var(--accent);flex:none;display:grid;place-items:center;color:#fff}
.ficon svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:1.6}
.grid.list{grid-template-columns:1fr;gap:0}
.grid.list .file{display:flex;align-items:center;border-radius:0;border-width:0 0 1px;gap:12px;padding:6px 8px}
.grid.list .file .th{width:72px;border:1px solid var(--line);border-radius:4px;flex:none}
.grid.list .file .meta{flex:1;padding:0}
.grid.list .file .acts{position:static;display:flex}
#hnav{border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
#hnav #syncst{margin-top:auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;padding:6px 8px 14px}
.mark{width:20px;height:20px;border-radius:6px;background:conic-gradient(from 210deg,#ff7262,#a259ff,#1abcfe,#0acf83,#ff7262);flex:none}
#hnav a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;color:var(--fg);text-decoration:none;font-size:12px;min-height:30px}
#hnav a:hover{background:var(--hover)}
#hnav a.on{background:var(--hover);font-weight:600}
#hnav a .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hnav a .cnt{color:var(--mute);font-size:11px}
#hnav .shd{padding:14px 8px 4px;color:var(--mute)}
#acct{margin-top:auto;border-top:1px solid var(--line);padding:10px 8px 4px;display:flex;align-items:center;gap:8px}
#acct .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;background:#0d99ff;flex:none}
#home main{overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px 24px}
#home header{display:flex;align-items:center;gap:8px;margin-bottom:20px;flex-wrap:wrap}
#home h1{font-size:13px;font-weight:600;margin:0;flex:1}
#search{height:32px;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:0 10px;min-width:0;width:240px;max-width:100%}
.starts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.start{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;align-items:center;gap:10px;background:var(--panel);min-width:200px;text-align:left}
.start:hover{border-color:var(--accent)}
.start b{display:block;font-size:12px}
.start i{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:16px;color:#fff;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.file{border:1px solid var(--line);border-radius:8px;cursor:pointer;position:relative;min-width:0;overflow:hidden;background:var(--panel)}
.file:hover,.file:focus-visible{border-color:var(--accent)}
.file .th{aspect-ratio:16/9;max-width:100%;background:var(--panel2);border-bottom:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.file .th img{max-width:88%;max-height:84%}
.file .meta{padding:10px 12px;display:flex;align-items:center;gap:10px}
.file .meta div{flex:1;min-width:0}
.file .nm{font-weight:500;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .acts{position:absolute;top:8px;right:8px;display:none;gap:4px}
.file:hover .acts,.file:focus-within .acts{display:flex}
.file .acts button{background:var(--panel);box-shadow:var(--shadow);width:28px;height:28px;border-radius:6px;border:0;display:grid;place-items:center;font-size:14px;color:var(--fg)}
.file .acts button.on{color:#ffc700}
.file .stard{position:absolute;top:8px;left:8px;color:#ffc700;font-size:14px;text-shadow:0 1px 3px #0006}
.empty{border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--mute)}
.sync{font-size:11px;color:var(--mute);display:flex;align-items:center;gap:6px;padding:4px 8px}
.dotst{width:7px;height:7px;border-radius:50%;background:var(--mute);flex:none}
/* editor */
#editor{display:grid;grid-template-columns:240px 1fr 248px;height:100%}
aside{background:var(--panel);overflow:auto;min-width:0;position:relative}
#left{border-right:1px solid var(--line);display:flex;flex-direction:column}
#right{border-left:1px solid var(--line)}
.fhead{display:flex;align-items:center;gap:6px;padding:8px 8px 2px}
.fname{font-weight:600;font-size:12px;padding:2px 4px;border-radius:4px;outline:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fname:hover{box-shadow:inset 0 0 0 1px var(--line)}
.fsub{color:var(--mute);padding:0 12px 8px;display:flex;align-items:center;gap:6px}
.tabs{display:flex;gap:2px;padding:4px 8px;border-bottom:1px solid var(--line);align-items:center}
.tabs button{background:none;border:0;padding:4px 8px;border-radius:5px;color:var(--mute);font-weight:500}
.tabs button.on{color:var(--fg);background:var(--hover)}
.sec{padding:8px 12px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.sec>h4,.shd{margin:0;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:24px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.f{display:flex;align-items:center;background:var(--panel2);border:1px solid transparent;border-radius:5px;height:24px;padding:0 6px;gap:6px;min-width:0}
.f:hover{border-color:var(--line)}
.f:focus-within{border-color:var(--accent)}
.f b{color:var(--mute);font-weight:400;min-width:10px;font-size:11px;white-space:nowrap}
.f input,.f select{background:none;border:0;outline:0;width:100%;min-width:0;height:100%;font-variant-numeric:tabular-nums}
.f select option{background:var(--panel)}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid #0000001a;flex:none;position:relative;overflow:hidden;padding:0}
.sw input{position:absolute;inset:-6px;width:30px;height:30px;opacity:0;cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);margin:0}
input[type=range]{accent-color:var(--accent)}
.pgl{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:5px;margin:0 4px;cursor:default}
.pgl:hover{background:var(--hover)}
.pgl.on{font-weight:600}
.pgl .ck{width:12px}
.pgl .act{opacity:0;background:none;border:0;border-radius:4px;width:22px;height:22px;color:var(--fg2);font-size:14px;line-height:1}
.pgl:hover .act,.pgl .act:focus-visible{opacity:1}
.pgl .act:hover{background:var(--line)}
#layers{flex:1;overflow:auto;padding:4px 0 24px}
.lyr{display:flex;align-items:center;gap:4px;height:28px;padding-right:6px;margin:0 4px;border-radius:5px;white-space:nowrap;cursor:default;border:1px solid transparent}
.lyr:hover{border-color:var(--line)}
.lyr.sel{background:var(--accentw)}
.lyr .tw{width:14px;color:var(--mute);text-align:center;flex:none;font-size:8px}
.lyr .ty{color:var(--mute);flex:none;display:flex}
.lyr.comp .ty,.lyr.comp .nm,.lyr.inst .ty,.lyr.inst .nm{color:var(--comp)}
.lyr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext;text-align:left}
.nm,.fname,#htitle{unicode-bidi:plaintext}
.lyr .act{opacity:0;background:none;border:0;color:var(--fg2);width:20px;height:20px;border-radius:4px;display:grid;place-items:center;padding:0}
.lyr .act svg{width:14px;height:14px}
.lyr:hover .act,.lyr .act.on{opacity:1}
.lyr.dim .nm,.lyr.dim .ty{opacity:.4}
.lyr.drop-in{border-color:var(--accent)}
.lyr.drop-a{box-shadow:inset 0 2px 0 var(--accent)}
.lyr.drop-b{box-shadow:inset 0 -2px 0 var(--accent)}
#stage{position:relative;overflow:hidden;background-color:var(--canvas);touch-action:none;outline:0}
#stage,#stage svg,#tabbar,.dock,.lyr,.pgl,#hnav a,.file{-webkit-user-select:none;user-select:none}
#stage #te,#stage #aip textarea,#stage #aip .msg{-webkit-user-select:text;user-select:text}
#stage.dots{background-image:radial-gradient(circle,var(--dot) 1px,transparent 1.3px)}
#cv,#ov{position:absolute;inset:0;width:100%;height:100%}
#ov{pointer-events:none}
#ov [data-h],#ov [data-lbl],#ov [data-pt],#ov [data-guide]{pointer-events:all}
#rul{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#rul [data-ruler]{pointer-events:all}
#stage.t-hand{cursor:grab}#stage.t-draw{cursor:crosshair}#stage.t-text{cursor:text}#stage.t-cmt{cursor:cell}
#te{position:absolute;background:transparent;border:1px solid var(--accent);outline:0;resize:none;overflow:hidden;padding:0;margin:0;unicode-bidi:plaintext;z-index:3;word-break:break-word}
.pin{position:absolute;width:28px;height:28px;border-radius:50% 50% 50% 4px;background:var(--panel);display:grid;place-items:center;font-size:11px;font-weight:600;transform:translate(0,-100%);cursor:pointer;box-shadow:var(--shadow);border:2px solid var(--accent);color:var(--fg)}
.dock{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:4px;display:flex;gap:2px;align-items:center;z-index:5}
.dock button{background:none;border:0;border-radius:8px;width:32px;height:32px;display:grid;place-items:center;color:var(--fg);position:relative}
.dock button:hover{background:var(--hover)}
.dock button.on{background:var(--accent);color:var(--onaccent)}
.dock .car{width:12px;height:32px;border-radius:6px;font-size:8px;color:var(--mute)}
.dock .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.dock .ai{width:auto;padding:0 10px;gap:6px;display:flex;font-weight:500}
.dock .ai.on{background:linear-gradient(135deg,#a259ff,#0d99ff)}
.dock .dev.on{background:var(--dev)}
.dock.top{bottom:auto;top:12px}
body.docktop #toast{bottom:auto;top:64px}
.pop{position:absolute;background:#1e1e1e;color:#fff;border-radius:8px;padding:6px;box-shadow:var(--shadow);z-index:60;min-width:200px;display:grid}
.pop button{background:none;border:0;color:#fff;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;text-align:left}
.pop button:hover,.pop button.on,.pop button:focus-visible{background:var(--accent);outline:0}
.pop button .k{margin-left:auto;color:#ffffff99}
.pop hr{border:0;border-top:1px solid #ffffff22;margin:4px 0}
.pop svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4}
.rtop{display:flex;align-items:center;gap:6px;padding:8px;border-bottom:1px solid var(--line)}
#peers{display:flex}
#peers span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:600;color:#fff;border:2px solid var(--panel);margin-left:-6px}
#aip{position:absolute;top:12px;right:12px;bottom:76px;width:min(360px,calc(100% - 24px));background:var(--panel);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:6;overflow:hidden}
#aip header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:12px}
.aimark{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,#d97757,#a259ff);display:grid;place-items:center;color:#fff;font-size:11px}
#aimsgs{flex:1;overflow:auto;padding:12px;display:grid;gap:10px;align-content:start}
.msg{padding:8px 10px;border-radius:10px;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:18px;max-width:92%;unicode-bidi:plaintext}
.msg.u{background:var(--accent);color:var(--onaccent);justify-self:end;border-bottom-right-radius:3px}
.msg.a{background:var(--panel2);justify-self:start;border-bottom-left-radius:3px}
.msg.t{background:none;color:var(--mute);padding:0 4px;font-size:11px}
.msg.err{background:none;color:var(--danger);padding:0 4px}
.ctx{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px 0}
.chip{background:var(--accentw);color:var(--accent);border-radius:4px;padding:1px 6px;font-weight:500;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.n{background:var(--panel2);color:var(--fg2);max-width:100%}
.quick{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px 0}
.quick button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:2px 8px;font-size:11px}
.quick button:hover{border-color:var(--accent)}
#aiform{padding:8px 12px 12px;display:grid;gap:6px}
#aiin{border:1px solid var(--line);border-radius:8px;padding:8px;resize:none;min-height:60px;max-height:160px;background:var(--panel);outline:0;font-size:12px;unicode-bidi:plaintext}
#aiin:focus{border-color:var(--accent)}
.modal{position:fixed;inset:0;background:#0006;display:grid;place-items:center;z-index:50;padding:16px}
.card{background:var(--panel);border-radius:12px;padding:16px;width:min(560px,100%);max-height:90vh;overflow:auto;display:grid;gap:12px;box-shadow:var(--shadow)}
.card h3{margin:0;font-size:13px}
#cmd .card{padding:0;gap:0;align-self:start;margin-top:12vh}
#cmd input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;font-size:13px;outline:0}
#cmdl{max-height:50vh;overflow:auto;padding:6px}
#cmdl div{padding:6px 8px;border-radius:5px;display:flex;justify-content:space-between;cursor:pointer;gap:8px;font-size:12px}
#cmdl div.on,#cmdl div:hover{background:var(--accent);color:#fff}
#cmdl div.on .k,#cmdl div:hover .k{color:#ffffffaa}
#present{position:fixed;inset:0;background:#1e1e1e;z-index:40;display:grid;place-items:center}
#present .bar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;color:#fff}
#present .btn{background:#2c2c2c;border-color:#444;color:#fff}
#pv{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
#toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#1e1e1e;color:#fff;padding:8px 14px;border-radius:6px;z-index:70;box-shadow:var(--shadow);font-size:12px}
pre.code{background:var(--panel2);border-radius:5px;padding:8px;font:11px/1.55 var(--mono);white-space:pre-wrap;word-break:break-all;margin:0;max-height:220px;overflow:auto}
.cmt{border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:6px}
.cmt textarea{background:var(--panel2);border:1px solid transparent;border-radius:5px;padding:6px;resize:vertical;min-height:44px;outline:0;unicode-bidi:plaintext}
.cmt textarea:focus{border-color:var(--accent)}

function moveMove(d,w,e){

function resizeMove(d,w,e){
  const h=d.h,dx=w.x-d.s.x,dy=w.y-d.s.y;
  if(d.n){const n=d.n,o=d.o;Object.assign(n,clone(o.snap));n.scaleText=e.shiftKey&&n.type==='text';const l=rot2(dx,dy,-o.rot);
    let L=h.includes('w')?l.x:0,R=h.includes('e')?l.x:0,T=h.includes('n')?l.y:0,B=h.includes('s')?l.y:0;
    let nw=o.w-L+R,nh=o.h-T+B;
    if((e.shiftKey||n.type==='image')&&h.length===2&&o.w&&o.h){const s=Math.max(nw/o.w,nh/o.h),w2=o.w*s,h2=o.h*s;if(h.includes('w'))L=o.w-w2;else R=w2-o.w;if(h.includes('n'))T=o.h-h2;else B=h2-o.h;nw=w2;nh=h2}
    if(e.altKey){nw=o.w+2*(R-L);nh=o.h+2*(B-T)}
    nw=Math.max(1,nw);nh=Math.max(n.type==='line'?0:1,nh);
    const sc=e.altKey?{x:0,y:0}:rot2((L+R)/2,(T+B)/2,o.rot);
    if(UI.psnap&&!o.rot){nw=Math.max(1,Math.round(nw));nh=Math.max(n.type==='line'?0:1,Math.round(nh))}setSize(n,fmt(nw),fmt(nh));delete n.scaleText;n.x=(o.rot?fmt:pxr)(o.c.x+sc.x-nw/2-o.pa.x);n.y=(o.rot?fmt:pxr)(o.c.y+sc.y-nh/2-o.pa.y);
    if(n.type==='text'&&!n.fixedH&&!h.includes('n'))n.y=fmt(o.c.y-o.h/2-o.pa.y);
    if(n.auto&&n.auto.on){if(L!==0||R!==0)n.auto.hugW=false;if(T!==0||B!==0)n.auto.hugH=false;n.auto.hug=false}if((L||R)&&n.sizeH==='fill')n.sizeH='fixed';if((T||B)&&n.sizeV==='fill')n.sizeV='fixed';
  }else{const b=d.bb;const L=h.includes('w')?dx:0,R=h.includes('e')?dx:0,T=h.includes('n')?dy:0,B=h.includes('s')?dy:0;
    const nw=Math.max(1,b.w-L+R),nh=Math.max(1,b.h-T+B),sx=nw/b.w,sy=nh/b.h,ox=b.x+L,oy=b.y+T;
    d.multi.forEach(m=>{Object.assign(m.n,clone(m.snap));setSize(m.n,m.w*sx,m.h*sy);m.n.x=fmt(ox+(m.a.x-b.x)*sx-m.pa.x);m.n.y=fmt(oy+(m.a.y-b.y)*sy-m.pa.y)})}
  relayout();syncInst();render();panelQuick();
}

function duplicate(nodes,off=0){const out=[];nodes.forEach(n=>{const c=clone(n);reid(c);c.x+=off;c.y+=off;const l=ALL[n.id].list;l.splice(l.indexOf(n)+1,0,c);out.push(c)});rebuildIdx();return out}

function del(){const s=topSel().filter(n=>!inInst(n));if(!s.length)return;s.forEach(n=>{const l=ALL[n.id]?.list;if(l)l.splice(l.indexOf(n),1)});UI.sel=[];refresh()}
function group(){const s=topSel();if(!s.length)return;const p=parentOf(s[0]);if(s.some(n=>parentOf(n)!==p)){toast('Select layers in the same parent to group them');return}
  const l=listOf(p),idx=Math.max(...s.map(n=>l.indexOf(n)));const g=mk('group');l.splice(idx+1,0,g);rebuildIdx();s.sort((a,b)=>l.indexOf(a)-l.indexOf(b)).forEach(n=>moveTo(n,g));UI.sel=[g.id];refresh()}
function frameSel(){const s=topSel();if(!s.length)return null;const p=parentOf(s[0]);const b=union(s.map(rbox));const pa=p?abs(p):{x:0,y:0};const l=listOf(p),idx=Math.max(...s.map(n=>l.indexOf(n)));
  const f=mk('frame',{x:fmt(b.x-pa.x),y:fmt(b.y-pa.y),w:fmt(b.w),h:fmt(b.h),fillOn:false});l.splice(idx+1,0,f);rebuildIdx();s.sort((a,b)=>l.indexOf(a)-l.indexOf(b)).forEach(n=>moveTo(n,f));UI.sel=[f.id];refresh();return f}
function ungroup(){const s=topSel().filter(n=>n.type==='group'||FRAMEY(n.type));if(!s.length)return;const ids=[];s.forEach(g=>{const p=parentOf(g),l=listOf(p);let idx=l.indexOf(g);[...g.children].forEach(c=>{moveTo(c,p,idx++);ids.push(c.id)});l.splice(l.indexOf(g),1);rebuildIdx()});UI.sel=ids;refresh()}
function order(k){topSel().forEach(n=>{const l=ALL[n.id].list,i=l.indexOf(n);l.splice(i,1);const j=k==='front'?l.length:k==='back'?0:k==='up'?Math.min(l.length,i+1):Math.max(0,i-1);l.splice(j,0,n)});refresh()}

  s.forEach(n=>{const b=rbox(n);let dx=0,dy=0;if(k==='l')dx=ref.x-b.x;if(k==='r')dx=ref.x+ref.w-b.x-b.w;if(k==='ch')dx=ref.x+ref.w/2-b.x-b.w/2;if(k==='t')dy=ref.y-b.y;if(k==='b')dy=ref.y+ref.h-b.y-b.h;if(k==='cv')dy=ref.y+ref.h/2-b.y-b.h/2;n.x=fmt(n.x+dx);n.y=fmt(n.y+dy)});refresh()}
function distribute(axis){const s=topSel();if(s.length<3){toast('Select 3 or more layers');return}const H=axis==='h';const bs=s.map(n=>({n,b:rbox(n)})).sort((a,b)=>H?a.b.x-b.b.x:a.b.y-b.b.y);const tot=bs.reduce((t,o)=>t+(H?o.b.w:o.b.h),0);const f=bs[0].b,la=bs[bs.length-1].b;const span=H?la.x+la.w-f.x:la.y+la.h-f.y;const gap=(span-tot)/(bs.length-1);let pos=H?f.x:f.y;

  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${fmt(b.w*scale)}" height="${fmt(b.h*scale)}" viewBox="0 0 ${fmt(b.w)} ${fmt(b.h)}"><defs><style>@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&amp;family=Roboto:ital,wght@0,100..900;1,100..900&amp;family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&amp;family=Open+Sans:ital,wdth,wght@0,75..100,300..800;1,75..100,300..800&amp;family=Montserrat:ital,wght@0,100..900;1,100..900&amp;family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&amp;family=Heebo:wght@100..900&amp;family=Rubik:ital,wght@0,300..900;1,300..900&amp;family=Assistant:wght@200..800&amp;family=Noto+Sans+Hebrew:wdth,wght@62.5..100,100..900&amp;family=Frank+Ruhl+Libre:wght@300..900&amp;family=Secular+One&amp;family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;family=Oswald:wght@200..700&amp;family=Space+Grotesk:wght@300..700&amp;family=DM+Serif+Display:ital@0;1&amp;family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&amp;display=swap');</style>${DEFS.join('')}</defs>${body}</svg>`;DEFS=saveD;return{svg,b}}
async function inlineImgs(svg){const urls=[...new Set([...svg.matchAll(/href="([^"#][^"]*)"/g)].map(m=>m[1]).filter(u=>!u.startsWith('data:')))];for(const u of urls){try{const bl=await (await fetch(u.replace(/&amp;/g,'&'))).blob();const du=await new Promise(res=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.readAsDataURL(bl)});svg=svg.split(`href="${u}"`).join(`href="${du}"`)}catch(e){}}return svg}
function loadImg(src){return new Promise(res=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src})}
async function cdrawPrep(nodes){const map={};const walk=n=>{if(n.type==='image'&&n.src&&!map[n.src])map[n.src]=loadImg(n.src);n.children.forEach(walk)};nodes.forEach(walk);for(const k in map)map[k]=await map[k];if(document.fonts)await document.fonts.ready;return map}
function cdraw(g,n,imgs,S){if(!n.vis)return;g.save();g.translate(n.x,n.y);if(n.rot){g.translate(n.w/2,n.h/2);g.rotate(rad(n.rot));g.translate(-n.w/2,-n.h/2)}g.globalAlpha*=n.op??1;if(n.blur>0)g.filter=`blur(${n.blur/2*S}px)`;
  const sh=n.shadow&&n.shadow.on;const shOn=()=>{if(sh){const c=C(n.shadow.c),o=n.shadow.o??.25;g.shadowColor=c+Math.round(o*255).toString(16).padStart(2,'0');g.shadowOffsetX=n.shadow.x*S;g.shadowOffsetY=n.shadow.y*S;g.shadowBlur=n.shadow.b*S}};const shOff=()=>{g.shadowColor='transparent'};
  const paint=()=>{if(n.grad&&n.grad.on){const a=rad(n.grad.angle||0),cx=n.w/2,cy=n.h/2,dx=Math.cos(a)*n.w/2,dy=Math.sin(a)*n.h/2;const gr=g.createLinearGradient(cx-dx,cy-dy,cx+dx,cy+dy);gr.addColorStop(0,C(col(n)));gr.addColorStop(1,C(n.grad.c2));return gr}return C(col(n))};
  const fillStroke=(path,rule)=>{shOn();if(n.fillOn){g.fillStyle=paint();g.fill(path,rule||'nonzero')}else if(sh){g.fillStyle='rgba(0,0,0,0)';}shOff();if(n.strokeOn){g.strokeStyle=C(n.stroke);g.lineWidth=n.sw;g.setLineDash(n.dash?[n.dash,n.dash]:[]);g.lineJoin='round';g.lineCap='round';g.stroke(path)}};
  const box=()=>{const p=new Path2D();if(p.roundRect&&n.rad)p.roundRect(0,0,n.w,n.h,Math.min(n.rad,n.w/2,n.h/2));else p.rect(0,0,n.w,n.h);return p};
  switch(n.type){
    case'rect':fillStroke(box());break;
    case'ellipse':{const p=new Path2D();p.ellipse(n.w/2,n.h/2,Math.max(0,n.w/2),Math.max(0,n.h/2),0,0,Math.PI*2);fillStroke(p);break}
    case'polygon':case'star':fillStroke(new Path2D('M'+polyPts(n).split(' ').join('L')+'Z'));break;
    case'path':fillStroke(new Path2D(pathD(n.pts,n.closed)));break;
    case'bool':{g.save();g.scale(n.sx||1,n.sy||1);g.translate(-n.ox,-n.oy);fillStroke(new Path2D(n.d||''),n.rule);g.restore();break}
    case'line':{g.strokeStyle=C(n.stroke);g.lineWidth=n.sw;g.lineCap='round';g.setLineDash(n.dash?[n.dash,n.dash]:[]);g.beginPath();g.moveTo(0,n.h/2);g.lineTo(n.w,n.h/2);if(n.arrow){g.moveTo(n.w-n.sw*4-4,n.h/2-n.sw*3-3);g.lineTo(n.w,n.h/2);g.lineTo(n.w-n.sw*4-4,n.h/2+n.sw*3+3)}g.stroke();break}
    case'image':{const im=imgs[n.src];g.save();g.clip(box());if(im){const iw=im.naturalWidth,ih=im.naturalHeight;if(n.fit==='stretch')g.drawImage(im,0,0,n.w,n.h);else{const s=n.fit==='fit'?Math.min(n.w/iw,n.h/ih):Math.max(n.w/iw,n.h/ih);g.drawImage(im,(n.w-iw*s)/2,(n.h-ih*s)/2,iw*s,ih*s)}}g.restore();if(n.strokeOn){g.strokeStyle=C(n.stroke);g.lineWidth=n.sw;g.stroke(box())}break}
    case'text':{const ls=tlines(n),lh=n.fs*n.lh,fm=fontMetrics(n),ta=textAlign(n),rtl=isRtl(n);g.font=tfont(n);try{g.fontStretch=n.fst||'normal';g.letterSpacing=(n.ls||0)+'px'}catch(e){}g.direction=rtl?'rtl':'ltr';g.textAlign=ta;g.textBaseline='alphabetic';g.fillStyle=paint();
      const vy=n.fixedH&&n.va?(n.va==='center'?(n.h-ls.length*lh)/2:n.va==='bottom'?n.h-ls.length*lh:0):0;const ax=ta==='center'?n.w/2:ta==='right'?n.w:0;shOn();
      ls.forEach((l,i)=>{const y=vy+i*lh+(lh-(fm.a+fm.d))/2+fm.a;if(n.fillOn!==false)g.fillText(l,ax,y);if(n.deco){const w=g.measureText(l).width;const x0=ta==='center'?ax-w/2:ta==='right'?ax-w:ax;const yy=n.deco==='underline'?y+n.fs*.12:y-n.fs*.3;g.fillRect(x0,yy,w,Math.max(1,n.fs/14))}});shOff();break}
    case'frame':case'comp':case'inst':{const b=box();fillStroke(b);g.save();if(n.clip)g.clip(b);n.children.forEach(c=>cdraw(g,c,imgs,S));g.restore();break}
    case'group':n.children.forEach(c=>cdraw(g,c,imgs,S));break}
  g.restore()}
async function toPng(nodes,scale,type='image/png'){const b=union(nodes.map(rbox))||{x:0,y:0,w:1,h:1};const imgs=await cdrawPrep(nodes);const c=document.createElement('canvas');c.width=Math.max(1,Math.round(b.w*scale));c.height=Math.max(1,Math.round(b.h*scale));const g=c.getContext('2d');if(type==='image/jpeg'){g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height)}
  g.scale(scale,scale);g.translate(-b.x,-b.y);nodes.forEach(n=>{const pa=pabs(n);g.save();g.translate(pa.x,pa.y);cdraw(g,n,imgs,scale);g.restore()});return new Promise(res=>c.toBlob(res,type,.92))}

  (async()=>{const svg=await inlineImgs(svgOf(nodes,1).svg);$('#exprev').innerHTML=`<img src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}" alt="Export preview" style="max-height:40vh;max-width:100%">`})();
  m.addEventListener('keydown',e=>{if(e.key==='Escape')m.remove()});

    if(id==='excp'){try{await navigator.clipboard.writeText(svgOf(nodes,1).svg);toast('SVG copied')}catch(_){toast('Clipboard is blocked here')}}

      if(!CAP.dl){$('#exmsg').textContent='Saving files is not available in this view. Use Copy SVG, or right-click the preview.';return}
      try{await CAP.dl.save({filename:fn,data});$('#exmsg').textContent='Saved '+fn;toast('Exported '+fn)}catch(err){$('#exmsg').textContent=err.code==='declined'?'Export cancelled.':'Export failed: '+(err.message||err.code)}}});
}

function startPresent(fid){const fs=frames();let f=fid?N(fid):null;if(!f){const s=topSel()[0];let t=s;while(t&&parentOf(t))t=parentOf(t);f=t&&fs.includes(t)?t:fs[0]}if(!f){toast('Add a frame to present');return}
  const P=document.createElement('div');P.id='present';P.innerHTML=`<div class="bar"><button class="btn" id="pback">← Back</button><span id="pname"></span><span class="sp"></span><label class="row"><input type="checkbox" id="phot"> Show hotspots</label><button class="btn" id="pclose">Close (Esc)</button></div><div id="pv"></div>`;document.body.appendChild(P);
  const stack=[];const show=(fr,tr='dissolve')=>{const{svg}=svgOf([fr],1);const v=$('#pv');const sc=Math.min((innerWidth-40)/fr.w,(innerHeight-80)/fr.h,1.5);
    v.style.animation='none';void v.offsetWidth;v.style.animation=tr==='none'?'none':'';
    v.innerHTML=svg.replace('<svg ',`<svg style="width:${fr.w*sc}px;height:${fr.h*sc}px;display:block;border-radius:${fr.rad||0}px;box-shadow:0 10px 40px #0008" `);$('#pname').textContent=nm(fr);P.dataset.cur=fr.id;
    if($('#phot').checked)v.querySelectorAll('[data-id]').forEach(g=>{if(N(g.dataset.id)?.link)g.setAttribute('style','outline:2px solid #0d99ff;cursor:pointer')})};
  show(f);
  P.addEventListener('click',e=>{if(e.target.id==='pclose'){close();return}if(e.target.id==='pback'){const b=stack.pop();if(b)show(N(b));return}if(e.target.id==='phot'){show(N(P.dataset.cur),'none');return}
    let el=e.target.closest('#pv [data-id]');while(el){const n=N(el.dataset.id);if(n&&n.link){if(n.link==='__back'){const b=stack.pop();if(b)show(N(b))}else{const t=N(n.link);if(t){stack.push(P.dataset.cur);show(t,n.trans||'dissolve')}}return}el=el.parentElement?.closest('#pv [data-id]')}
    $('#pv').querySelectorAll('[data-id]').forEach(g=>{if(N(g.dataset.id)?.link){g.style.outline='2px solid #0d99ff';setTimeout(()=>g.style.outline='',600)}})});
  const key=e=>{if(e.key==='Escape')close();if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const i=fs.indexOf(N(P.dataset.cur));show(fs[(i+(e.key==='ArrowRight'?1:-1)+fs.length)%fs.length])}};document.addEventListener('keydown',key,true);
  function close(){document.removeEventListener('keydown',key,true);P.remove()}}

function openCmd(){const m=document.createElement('div');m.className='modal';m.id='cmd';m.innerHTML=`<div class="card" role="dialog" aria-label="Quick actions"><input id="cmdi" placeholder="Search actions and plugins" aria-label="Search actions"><div id="cmdl" role="listbox"></div></div>`;document.body.appendChild(m);
  const all=commands();let list=all,ix=0;const draw=()=>{$('#cmdl').innerHTML=list.slice(0,80).map((c,i)=>`<div class="${i===ix?'on':''}" data-ci="${i}" role="option" aria-selected="${i===ix}"><span>${esc(c.n)}</span><span class="k">${esc(c.k)}</span></div>`).join('')||'<div class="hint">No matching actions</div>';$('#cmdl .on')?.scrollIntoView({block:'nearest'})};draw();
  const run=c=>{m.remove();c&&c.f()};const inp=$('#cmdi');inp.focus();
  inp.addEventListener('input',()=>{const q=inp.value.trim().toLowerCase();list=all.filter(c=>c.n.toLowerCase().includes(q)||c.k.toLowerCase().includes(q));ix=0;draw()});

const AI_RULES=`You are Claude, working inside Vellum, a vector interface design editor. The person is designing on the canvas and talks to you from a side panel. Each message includes the current canvas context and the selected layers.
How to work:
- If they ask for a change, make it with the tools (update_layers, create_layers, delete_layers, select_layers), then reply in one or two short sentences saying what you changed. If they ask a question, answer briefly without tools.
- The selection is what "this", "these" and "it" refer to. If nothing is selected, the request is about the whole page.
- Layer model: type is frame | rect | ellipse | line | polygon | star | text | path | group | comp | inst. x,y are relative to the parent. Colors are 6-digit hex. Text layers use text, fs (size), fw (weight 400-800), font (Inter, Roboto, Open Sans, Montserrat, Poppins, Rubik, Heebo, Assistant, Noto Sans Hebrew, Playfair Display, Oswald, Space Grotesk, DM Serif Display, JetBrains Mono), fw 100-900, italic true/false, fst (font width keyword such as condensed or expanded), ta (start|center|end), fill (text color); give w to make a wrapping text box. Frames can have auto layout: auto {on:true, dir:"v"|"h", gap, pad (or pt/pr/pb/pl per side), align:"start|center|end|stretch", just:"start|center|end|between", hugW, hugH, wrap, rtl}. Children of auto layout frames take sizeH / sizeV = "fixed" | "hug" | "fill" (fill = fill container) plus optional minW/maxW/minH/maxH. Icons: {type:"path", d:"<SVG path data>", viewBox:24, w:24, h:24, stroke:"#hex", sw:2} or fill. Images: {type:"image", src:"https://…", w, h}. Text inside an instance can be changed with update_layers on its id (it becomes an override). Corner radius is rad. Opacity is op (0-1). Shadow: shadow {on:true,x,y,b,c,o}.
- Name layers in English with clear names (e.g. "Header", "Primary button"). Mobile screens are frames of 390x844 with a white fill; place new screens in the free space given in the context.
- Act like a senior product designer who works autonomously. Do not ask clarifying questions unless you cannot start at all; make sensible assumptions, state them in one short line, and build.
- For a big request (an app, a website, a flow), write a short plan (screens and shared components), then build all of it: each screen is its own top-level frame (mobile 390x844, desktop 1440x1024) placed left to right with 100px gaps starting at the free space in the context. Use auto layout frames for headers, lists, cards, forms and navigation bars; reuse components; use the color variables when they exist; add prototype links (link: id of the destination frame) between screens.
- Build one screen per create_layers call, with all its children nested. Large requests take several steps.
- Quality bar: 8px spacing grid, 16-24px side padding on mobile, a clear type scale (32/24/20/16/14/12), weights 400-700, touch targets at least 44px tall, accessible contrast, realistic content (no lorem ipsum). Draw simple icons with small shapes.
- Hebrew: when the person writes Hebrew, write the interface text in Hebrew, set auto.rtl true on horizontal auto layout rows, and keep ta "start" (Hebrew aligns right automatically).
- End every reply with a last line "STATUS: DONE" when the whole request is complete, or "STATUS: CONTINUE" when more steps are needed. You will then be called again with the updated canvas.
- Reply in the language the person writes in.`;
function applyProps(n,p){const ignored=[];const ok=['sizeH','sizeV','minW','maxW','minH','maxH','src','fit','name','x','y','w','h','rot','fill','fillOn','stroke','strokeOn','sw','dash','rad','op','vis','lock','text','fs','fw','font','ta','lh','ls','italic','upper','deco','fst','blur','shadow','auto','clip','sides','inner','closed','link','absPos','cons','grad','style','arrow'];
  let w=n.w,h=n.h,hasW=false,hasH=false;for(const k in p){if(!ok.includes(k)){ignored.push(k);continue}let v=p[k];
    if(k==='src'&&!/^(https:\/\/|data:image\/|\/_blob\/)/.test(String(v))){ignored.push(k);continue}
    if(['x','y','rot','sw','dash','rad','op','fs','fw','lh','ls','blur','sides','inner','minW','maxW','minH','maxH'].includes(k)){v=Number(v);if(!isFinite(v))continue}
    if(['fill','stroke'].includes(k)&&!/^#[0-9a-f]{6}$/i.test(String(v))){ignored.push(k+' (use #RRGGBB)');continue}
    if(k==='w'){w=Number(v);hasW=isFinite(w);continue}if(k==='h'){h=Number(v);hasH=isFinite(h);continue}
    if(k==='auto'&&v&&typeof v==='object'){n.auto=Object.assign(defaultsFor('auto'),n.auto||{},v,{on:v.on!==false});continue}
    if(k==='shadow'&&v&&typeof v==='object'){n.shadow=Object.assign(defaultsFor('shadow'),n.shadow||{},v,{on:v.on!==false});continue}
    if(k==='fill'){n.style=null;n.fillOn=true}
    if(k==='stroke')n.strokeOn=true;
    n[k]=v}
  if(n.type==='text'){if(hasW){n.fixedW=true;n.w=Math.max(1,w)}measure(n)}else if((hasW||hasH)&&(w!==n.w||h!==n.h)){setSize(n,Math.max(1,w),Math.max(1,h));if(n.auto&&n.auto.on){n.auto.hug=false;if(hasW)n.auto.hugW=false;if(hasH)n.auto.hugH=false}}return ignored}
function buildNode(spec){
  if(spec.d&&['path','icon','vector','svg'].includes(spec.type)){const d=String(spec.d);if(!/^[MmLlHhVvCcSsQqTtAaZz0-9.,\s+\-eE]*$/.test(d))throw new Error('d must be SVG path data');const vb=Number(spec.viewBox)||24;const w=Number(spec.w)||24,h=Number(spec.h)||w;
    const n=mk('rect',{type:'bool',name:String(spec.name||'Icon'),d,ox:0,oy:0,sx:w/vb,sy:h/vb,rule:'nonzero',w,h,fillOn:spec.fill!=null,strokeOn:spec.stroke!=null,fill:'#000000'});const sp={...spec};delete sp.w;delete sp.h;delete sp.type;delete sp.d;applyProps(n,sp);n.fillOn=spec.fill!=null||spec.fillOn===true;n.strokeOn=spec.stroke!=null;if(n.strokeOn)n.sw=(Number(spec.sw)||2);return n}
  if(spec.type==='image'){const n=mk('image',{fit:'fill',fillOn:false,w:Number(spec.w)||200,h:Number(spec.h)||150});applyProps(n,spec);if(!n.src)n.fillOn=true;return n}
  if(spec.component){const m=Object.values(ALL).find(a=>a.n.type==='comp'&&(a.n.id===spec.component||nm(a.n)===spec.component));if(m)return mk('inst',{name:m.n.name,master:m.n.id,x:Number(spec.x)||0,y:Number(spec.y)||0,w:Number(spec.w)||m.n.w,h:Number(spec.h)||m.n.h})}
  const type=['frame','rect','ellipse','line','polygon','star','text','path','group','comp'].includes(spec.type)?spec.type:'rect';
  const n=mk(type);if(type==='text'&&spec.text==null)spec.text='Text';applyProps(n,spec);if(spec.name)n.name=String(spec.name);
  if(Array.isArray(spec.children)&&CONTAINER(type))spec.children.forEach(c=>n.children.push(buildNode(c||{})));
  return n}
const aiTools=()=>[
  {name:'update_layers',description:'Change properties of existing layers. Pass the layer ids from the context and only the props to change. Returns which layers changed.',
    inputSchema:{type:'object',properties:{updates:{type:'array',items:{type:'object',properties:{id:{type:'string'},props:{type:'object',description:'e.g. {"fill":"#0D99FF","text":"Sign in","fs":18,"w":200,"auto":{"gap":16}}'}},required:['id','props']}}},required:['updates']},
    execute:(inp)=>{const ups=Array.isArray(inp.updates)?inp.updates:[];const done=[],miss=[],ign=[];
      ups.forEach(u=>{const n=N(String(u.id));if(!n){miss.push(u.id);return}const inst=inInst(n);
        if(inst){const src=n.id.split('~').pop();const okO=['text','fill','vis','fs','fw','font','src'];inst.ovr=inst.ovr||[];for(const k in (u.props||{})){if(!okO.includes(k)){ign.push(k+' (not overridable in an instance)');continue}let v=u.props[k];if(k==='fill'&&!/^#[0-9a-f]{6}$/i.test(String(v))){ign.push('fill (use #RRGGBB)');continue}inst.ovr=inst.ovr.filter(o=>!(o.src===src&&o.k===k));inst.ovr.push({src,k,v})}done.push(nm(n)+' (instance override)');return}
        ign.push(...applyProps(n,u.props||{}));done.push(nm(n))});
      refresh();aiPush('t',`✎ Updated ${done.length} layer${done.length===1?'':'s'}${done.length?': '+done.slice(0,5).join(', '):''}`);if(miss.length)throw new Error('Unknown ids: '+miss.join(', ')+'. Read the canvas again for current ids.');return{updated:done.length,ignoredProps:[...new Set(ign)]}}},
  {name:'create_layers',description:'Create new layers, with nested children, inside parentId (omit for the page). Each layer: {type,name,x,y,w,h,fill,text,fs,fw,ta,rad,stroke,sw,auto,shadow,children,component}. Use component (a component id or name) to place an instance. Returns the new ids.',
    inputSchema:{type:'object',properties:{parentId:{type:'string'},layers:{type:'array',items:{type:'object'}}},required:['layers']},
    execute:(inp)=>{const par=inp.parentId?N(String(inp.parentId)):null;if(inp.parentId&&(!par||!CONTAINER(par.type)||par.type==='inst'))throw new Error('parentId is not a frame or group');const ids=[];(Array.isArray(inp.layers)?inp.layers:[]).forEach(s=>{const n=buildNode(s||{});listOf(par).push(n);ids.push(n.id)});UI.sel=ids;refresh();aiPush('t',`＋ Created ${ids.length} layer${ids.length===1?'':'s'}`);const f=ids.map(N).filter(Boolean);if(f.length&&!par)zoomFit(f);return{ids}}},
  {name:'delete_layers',description:'Delete layers by id. Returns how many were deleted.',inputSchema:{type:'object',properties:{ids:{type:'array',items:{type:'string'}}},required:['ids']},
    execute:(inp)=>{let k=0;(inp.ids||[]).forEach(id=>{const a=ALL[String(id)];if(a&&!inInst(a.n)){a.list.splice(a.list.indexOf(a.n),1);rebuildIdx();k++}});UI.sel=UI.sel.filter(i=>ALL[i]);refresh();aiPush('t',`Deleted ${k} layer${k===1?'':'s'}`);return{deleted:k}}},
  {name:'select_layers',description:'Select layers on the canvas and zoom to them, to show the person something.',inputSchema:{type:'object',properties:{ids:{type:'array',items:{type:'string'}}},required:['ids']},
    execute:(inp)=>{const ids=(inp.ids||[]).map(String).filter(id=>ALL[id]&&ALL[id].pi===D.cur);select(ids);const ns=ids.map(N);if(ns.length)zoomFit(ns);return{selected:ids.length}}},
  {name:'add_page',description:'Add a new page to the file and switch to it. Returns the page name.',inputSchema:{type:'object',properties:{name:{type:'string'}},required:['name']},
    execute:(inp)=>{D.pages.push({id:'p'+Date.now(),name:String(inp.name||'Page'),bg:'',nodes:[]});D.cur=D.pages.length-1;UI.sel=[];refresh();aiPush('t','＋ Added page '+page().name);return{page:page().name}}},
  {name:'make_component',description:'Turn a frame into a reusable component (by id). Place instances later with create_layers {component:id}.',inputSchema:{type:'object',properties:{id:{type:'string'}},required:['id']},
    execute:(inp)=>{const n=N(String(inp.id));if(!n||!FRAMEY(n.type))throw new Error('Not a frame id');UI.sel=[n.id];makeComp();return{id:n.id,type:n.type}}},
];
const aiClean=t=>String(t||'').replace(/\n?\s*STATUS:\s*(DONE|CONTINUE)\s*$/i,'').trim();
async function aiSend(override){const inp=$('#aiin');const text=(override??inp.value).trim();if(!text||AIBUSY)return;if(!CAP.sample){aiPush('err','Claude is not available in this view. Open the page on claude.ai to use it.');return}
  inp.value='';AIBUSY=true;$('#aigo').disabled=true;$('#aistop').hidden=false;AICTL=new AbortController();
  const hist=AIT.filter(m=>m.role==='user'||m.role==='assistant').slice(-12);
  AIT.push({role:'user',content:text,view:text});
  const base=[{role:'user',content:AI_RULES},{role:'assistant',content:'Understood. I will plan, build the whole request with the tools over as many steps as needed, and end each reply with a STATUS line.'}];
  hist.forEach(m=>base.push({role:m.role,content:m.content||'(no reply)'}));
  const tiers=CAP.limits?.modelTiers;const tier=Array.isArray(tiers)?(tiers.includes('complex')?'complex':undefined):(tiers&&tiers.complex?'complex':undefined);
  let step=0,done=false,work=[];
  try{
    while(!done&&step<10&&!AICTL.signal.aborted){step++;
      const bubble={role:'assistant',content:'',view:step>1?`Step ${step}: continuing…`:'Thinking…'};AIT.push(bubble);aiDraw();
      const turns=[...base,...work,{role:'user',content:ctxText()+'\n\n[Request]\n'+text+(step>1?`\n\n[Progress]\nThis is step ${step}. Your earlier steps are already applied to the canvas shown above. Continue with what is left; do not redo finished parts.`:'')}];
      for(let i=turns.length-1;i>0;i--){if(turns[i].role===turns[i-1].role)turns.splice(i-1,1)}
      const opts={cache:false,signal:AICTL.signal,onText:({text})=>{bubble.view=aiClean(text)||'Thinking…';aiDraw()}};if(tier)opts.modelTier=tier;
      if(CAP.limits?.tools!==false)opts.tools=aiTools();
      try{const s=topSel();if(step===1&&$('#aiimg')?.checked&&CAP.limits?.images&&(s.length||page().nodes.length)){const bl=await toPng(s.length?s:page().nodes.filter(n=>n.vis),1);if(bl&&bl.size<(CAP.limits.images.maxBytes||5e6))opts.images=[bl]}}catch(e){}
      try{const res=await CAP.sample(turns,opts);const t=res.text||'';done=!/STATUS:\s*CONTINUE/i.test(t);bubble.content=aiClean(t);bubble.view=bubble.content||(done?'Done.':'Working…');
        work.push({role:'user',content:`[Request]\n${text}\n(step ${step})`},{role:'assistant',content:t||'(changes applied with tools)'});if(work.length>8)work=work.slice(-8)}
      catch(e){bubble.content=e.text||'';bubble.view=aiClean(e.text||'');const msg={cancelled:'Stopped.',not_granted:'Claude access was not allowed for this page.',rate_limited:'Usage limit reached. Try again in a little while.',prompt_too_large:'This page is too large to send. Select fewer layers.',tools_unavailable:'Editing tools are not available in this view.',images_unavailable:'Snapshots are not available here. Untick “Attach snapshot”.',refused:'Claude declined this request.'}[e.code]||('Something went wrong: '+(e.message||e.code));aiPush(e.code==='cancelled'?'t':'err',msg);if(!bubble.view)AIT.splice(AIT.indexOf(bubble),1);done=true}
    }

/* ================= runtime capabilities ================= */
function pushPresence(){if(!CAP.room)return;const s=D?topSel():[];CAP.room.presence({file:PID||null,view:D?'editor':'files',fileName:D?String(D.name).slice(0,80):null,page:D?String(page().name).slice(0,80):null,sel:s.slice(0,10).map(n=>({id:n.id,type:n.type,name:String(nm(n)).slice(0,60)}))}).catch(()=>{})}
async function initDesk(){const dk=CAP.desk;
  CAP.dl={save:async({filename,data})=>{const buf=data instanceof Blob?new Uint8Array(await data.arrayBuffer()):data;const ok=await dk.saveFile(filename,buf);if(!ok)throw{code:'declined'};return{status:'saved'}}};
  try{const f=await dk.getFolders();if(Array.isArray(f)&&f.length)FOLDERS=f;else if(FOLDERS.length)dk.setFolders(FOLDERS)}catch(e){}
  syncState('All changes saved on this computer','ok');
  try{LOCALFONTS=(await dk.fonts()).filter(f=>!FONTS.includes(f))}catch(e){}
  dk.onCommand(deskCommand);
  window.__vellumFlush=async()=>{if(D&&PID){clearTimeout(saveT);putDoc(PID,D)}await LASTSAVE;await dk.flush()};
  if(!D){FILES=await listFiles();renderHome()}}
/* commands sent by Claude Desktop / Claude Code through the Vellum MCP connector */
async function deskCommand(tool,args){const need=()=>{if(!D)throw new Error('No file is open. Use vellum_open_file or vellum_create_file first.')};
  switch(tool){
    case 'open_file':{const d=await loadDoc(String(args.id));if(!d)throw new Error('No file with id '+args.id);openFile(String(args.id),d);return{opened:d.name,pages:d.pages.map(p=>p.name)}}
    case 'create_file':{createFile('blank');D.name=String(args.name||'Untitled');putDoc(PID,D);layers();return{id:PID,name:D.name}}
    case 'get_canvas':{need();if(args.page){const i=D.pages.findIndex(p=>p.name===args.page);if(i<0)throw new Error('No page named '+args.page);if(i!==D.cur){D.cur=i;UI.sel=[];refresh(false)}}return ctxText()}
    case 'get_selection':{need();return topSel().map(n=>compact(n))}
    case 'update_layers':case 'create_layers':case 'delete_layers':case 'select_layers':case 'add_page':case 'make_component':{need();const t=aiTools().find(x=>x.name===tool);return await t.execute(args,{})}
    case 'snapshot':{need();const ns=(args.ids&&args.ids.length?args.ids.map(String).map(N).filter(Boolean):page().nodes.filter(n=>n.vis));if(!ns.length)throw new Error('Nothing to show on this page');const b=union(ns.map(rbox));const sc=Math.min(2,1600/Math.max(b.w,b.h,1));const bl=await toPng(ns,sc);const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(bl)});return{png:b64}}
    default:throw new Error('Unknown command '+tool)}}
async function connectDialog(){const dk=CAP.desk;if(!dk){toast('Connecting Claude works in the Vellum desktop app');return}const cmd=await dk.claudeCodeCommand();
  const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card" role="dialog" aria-label="Connect Claude"><h3>Connect Claude to Vellum</h3>
    <div class="hint" style="font-size:12px;line-height:18px">Claude works on your designs through the Vellum connector (MCP), with your normal Claude account and no extra cost. Keep Vellum open while Claude works.</div>
    <div class="sec" style="padding:0;border:0"><h4>Claude Desktop</h4><div class="hint">Adds Vellum to Claude Desktop. Restart Claude Desktop afterwards, then ask: “In Vellum, design a 4-screen onboarding flow”.</div><button class="btn pri big" id="cc-desk">Connect Claude Desktop</button><div class="hint" id="cc-msg"></div></div>
    <div class="sec" style="padding:0;border:0"><h4>Claude Code</h4><div class="hint">Run this once in a terminal:</div><pre class="code" id="cc-cmd">${esc(cmd)}</pre><button class="btn" data-copy="cc-cmd" id="cc-copy">Copy command</button></div>
    <div class="row"><span class="sp"></span><button class="btn big" id="cc-x">Close</button></div></div>`;document.body.appendChild(m);
  m.addEventListener('click',async e=>{if(e.target===m||e.target.id==='cc-x')m.remove();if(e.target.id==='cc-copy')copyText($('#cc-cmd'));if(e.target.id==='cc-desk'){const r=await dk.connectClaude();$('#cc-msg').textContent=r.ok?'Connected. Restart Claude Desktop to load Vellum.':'Could not connect: '+r.error}})}
async function initCaps(){if(CAP.desk)return initDesk();if(!window.claude?.use)return;const use=n=>window.claude.use(n).catch(()=>null);
  const [dl,user,db,assets,sample,room]=await Promise.all([use('downloads'),use('user'),use('db'),use('assets'),use('sample'),use('room')]);
  CAP.dl=dl;CAP.assets=assets;CAP.sample=sample;CAP.user=user;
  if(sample){try{CAP.limits=await sample.limits()}catch(e){CAP.limits={}}}
  if(user){try{CAP.me=await user.me()}catch(e){}}
  if(user&&db){try{CAP.uid=await user.id()}catch(e){}if(CAP.uid){CAP.db=db;syncState('Synced to your account','ok');
    try{const qs=await db.collection(`data/users/${CAP.uid}`).get();const have=new Set(qs.docs.map(d=>d.id));
      for(const p of readIndex()){if(!have.has('p_'+p.id)){const js=LS.get('cs-doc-'+p.id);if(js){try{const d=JSON.parse(js);await remoteSave(p.id,d,js,p.thumb||'')}catch(e){}}}}
      if(FOLDERS.length&&!have.has('folders'))saveFolders()}catch(e){}}}
  if(!D){FILES=await listFiles();renderHome()}
  if(room){CAP.room=room;const colors=['#ff7262','#0acf83','#ffc700','#f24e1e','#a259ff','#1abcfe'];const me=CAP.me?.color||colors[Math.floor(Math.random()*colors.length)];
    UI.nick=CAP.me?.name?CAP.me.name.split(' ')[0]:'Guest '+Math.floor(Math.random()*90+10);
    room.presence({color:me,nick:UI.nick,who:{c:me,t:Date.now()}}).catch(()=>{});pushPresence();
    room.onPeers(ch=>{UI.peers=ch.peers;$('#peers').innerHTML=ch.peers.filter(p=>p.kind==='viewer').slice(0,5).map(p=>`<span style="background:${esc(p.presence?.color||'#888')}" title="${esc(p.presence?.nick||'Guest')}${p.sameTab?' (you)':''}">${esc(String(p.presence?.nick||'?').slice(0,1).toUpperCase())}</span>`).join('');if(D)drawOv()},()=>{});checkSend()}
}

/* ================= boot ================= */
(async function boot(){UI.rulers=LS.get('cs-rulers')==='1';UI.hsort=LS.get('cs-hsort')||'edited';UI.hlist=LS.get('cs-hlist')==='1';const th=LS.get('cs-theme');if(th)document.documentElement.dataset.theme=th;
  const old=LS.get('studio-doc');if(old&&!readIndex().length){try{const d=JSON.parse(old);if(d.pages){d.name=d.name||'My first file';putDoc(newId(),d,false)}}catch(e){}}
  if(!readIndex().length){D={seq:1,cur:0,mode:'light',styles:[],comments:[],name:'Untitled',pages:[]};sampleMobile();putDoc(newId(),D,false);D=null}
  setTool('v');
  const capsP=initCaps();
  const id=location.hash.slice(1);if(id&&id.startsWith('f')){const d=await loadDoc(id);if(d){openFile(id,d);return}}
  goHome();await capsP;
})();
