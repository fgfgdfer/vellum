/* Layout: file browser home (projects sidebar + file grid), then editor = left panel (file, pages, layers) | canvas with floating bottom toolbar | right inspector. Light by default, dark follows the computer. */
:root{
  --panel:#ffffff; --panel2:#f5f5f5; --hover:#f0f0f0; --line:#e6e6e6; --fg:#1e1e1e; --fg2:#5c5c5c; --mute:#666666;
  --accent:#0b6fcb; --accent-text:#0b6fcb; --accentw:#e5f4ff; --onaccent:#ffffff; --comp:#9747ff; --compw:#f1e9ff; --dev:#14ae5c; --danger:#f24822;
  --canvas:#f5f5f5; --dot:#0000001a; --shadow:0 2px 6px #0000000f,0 8px 28px #0000001f; --ui:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#2c2c2c;--panel2:#383838;--hover:#3a3a3a;--line:#444444;--fg:#ffffff;--fg2:#c7c7c7;--mute:#9b9b9b;--accent:#0c8ce9;--accentw:#0c8ce93a;--comp:#a970ff;--compw:#a970ff33;--canvas:#1e1e1e;--dot:#ffffff1c;--shadow:0 2px 6px #0006,0 8px 28px #0008;color-scheme:dark}}
:root[data-theme="dark"]{--panel:#2c2c2c;--panel2:#383838;--hover:#3a3a3a;--line:#444444;--fg:#ffffff;--fg2:#c7c7c7;--mute:#9b9b9b;--accent:#0c8ce9;--accentw:#0c8ce93a;--comp:#a970ff;--compw:#a970ff33;--canvas:#1e1e1e;--dot:#ffffff1c;--shadow:0 2px 6px #0006,0 8px 28px #0008;color-scheme:dark}
html,body{height:100%;background:var(--panel);color:var(--fg);font:11px/16px var(--ui);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ib{background:none;border:0;border-radius:5px;height:24px;min-width:24px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--fg);white-space:nowrap}
.ib:hover{background:var(--hover)}
.ib svg,.dock svg,.lyr svg,#hnav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round;flex:none}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:5px;height:24px;padding:0 8px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:500}
.btn.pri:hover{filter:brightness(1.07)}
.btn.big{height:32px;padding:0 12px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:default}
.sp{flex:1}
.hint{color:var(--mute)}
.k{color:var(--mute)}
:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
/* home */
#shell{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
#tabbar{grid-row:1}#home,#editor{grid-row:2;min-height:0}
#tabbar{display:flex;height:36px;align-items:stretch;background:#1e1e1e;color:#fff;overflow-x:auto;scrollbar-width:none;padding-left:max(0px,env(safe-area-inset-left,0px))}
#tabbar::-webkit-scrollbar{display:none}
#tabbar button{background:none;border:0;color:#ffffffb3;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;font-size:11px;max-width:190px;border-right:1px solid #ffffff14;white-space:nowrap;flex:none}
#tabbar button .t{overflow:hidden;text-overflow:ellipsis}
#tabbar button.on{background:var(--panel);color:var(--fg)}
#tabbar button:hover:not(.on){background:#2c2c2c;color:#fff}
#tabbar .x{opacity:0;width:16px;height:16px;border-radius:3px;display:grid;place-items:center;font-size:12px}
#tabbar button:hover .x,#tabbar button.on .x{opacity:.65}
#tabbar .x:hover{background:#8884;opacity:1}
#tabbar .home{padding:0 14px}
#tabbar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4}
#home{display:grid;grid-template-columns:248px 1fr;background:var(--panel);min-height:0}
#hacct{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-weight:600;font-size:13px}
#hacct:hover{background:var(--hover)}
#hacct .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:12px;flex:none}
#hsearch{width:100%;height:32px;border:1px solid transparent;background:var(--panel2);border-radius:6px;padding:0 10px;outline:0}
#hsearch:focus{border-color:var(--accent)}
.hdiv{border-top:1px solid var(--line);margin:8px 0}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tools .f{height:28px}
.ficon{width:18px;height:18px;border-radius:4px;background:var(--accent);flex:none;display:grid;place-items:center;color:#fff}
.ficon svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:1.6}
.grid.list{grid-template-columns:1fr;gap:0}
.grid.list .file{display:flex;align-items:center;border-radius:0;border-width:0 0 1px;gap:12px;padding:6px 8px}
.grid.list .file .th{width:72px;border:1px solid var(--line);border-radius:4px;flex:none}
.grid.list .file .meta{flex:1;padding:0}
.grid.list .file .acts{position:static;display:flex}
#hnav{border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
#hnav #syncst{margin-top:auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;padding:6px 8px 14px}

#hnav a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;color:var(--fg);text-decoration:none;font-size:12px;min-height:30px}
#hnav a:hover{background:var(--hover)}
#hnav a.on{background:var(--hover);font-weight:600}
#hnav a .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hnav a .cnt{color:var(--mute);font-size:11px}
#hnav .shd{padding:14px 8px 4px;color:var(--mute)}
#acct{margin-top:auto;border-top:1px solid var(--line);padding:10px 8px 4px;display:flex;align-items:center;gap:8px}
#acct .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;background:#0d99ff;flex:none}
#home main{overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px 24px}
#home header{display:flex;align-items:center;gap:8px;margin-bottom:20px;flex-wrap:wrap}
#home h1{font-size:13px;font-weight:600;margin:0;flex:1}
#search{height:32px;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:0 10px;min-width:0;width:240px;max-width:100%}
.starts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.start{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;align-items:center;gap:10px;background:var(--panel);min-width:200px;text-align:left}
.start:hover{border-color:var(--accent)}
.start b{display:block;font-size:12px}
.start i{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:16px;color:#fff;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.file{border:1px solid var(--line);border-radius:8px;cursor:pointer;position:relative;min-width:0;overflow:hidden;background:var(--panel)}
.file:hover,.file:focus-visible{border-color:var(--accent)}
.file .th{aspect-ratio:16/9;max-width:100%;background:var(--panel2);border-bottom:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.file .th img{max-width:88%;max-height:84%}
.file .meta{padding:10px 12px;display:flex;align-items:center;gap:10px}
.file .meta div{flex:1;min-width:0}
.file .nm{font-weight:500;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .acts{position:absolute;top:8px;right:8px;display:none;gap:4px}
.file:hover .acts,.file:focus-within .acts{display:flex}
.file .acts button{background:var(--panel);box-shadow:var(--shadow);width:28px;height:28px;border-radius:6px;border:0;display:grid;place-items:center;font-size:14px;color:var(--fg)}
.file .acts button.on{color:#ffc700}
.file .stard{position:absolute;top:8px;left:8px;color:#ffc700;font-size:14px;text-shadow:0 1px 3px #0006}
.empty{border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--mute)}
.sync{font-size:11px;color:var(--mute);display:flex;align-items:center;gap:6px;padding:4px 8px}
.dotst{width:7px;height:7px;border-radius:50%;background:var(--mute);flex:none}
/* editor */
#editor{display:grid;grid-template-columns:240px 1fr 248px;height:100%}
aside{background:var(--panel);overflow:auto;min-width:0;position:relative}
#left{border-right:1px solid var(--line);display:flex;flex-direction:column}
#right{border-left:1px solid var(--line)}
.fhead{display:flex;align-items:center;gap:6px;padding:8px 8px 2px}
.fname{font-weight:600;font-size:12px;padding:2px 4px;border-radius:4px;outline:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fname:hover{box-shadow:inset 0 0 0 1px var(--line)}
.fsub{color:var(--mute);padding:0 12px 8px;display:flex;align-items:center;gap:6px}
.tabs{display:flex;gap:2px;padding:4px 8px;border-bottom:1px solid var(--line);align-items:center}
.tabs button{background:none;border:0;padding:4px 8px;border-radius:5px;color:var(--mute);font-weight:500}
.tabs button.on{color:var(--fg);background:var(--hover)}
.sec{padding:8px 12px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.sec>h4,.shd{margin:0;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:24px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.f{display:flex;align-items:center;background:var(--panel2);border:1px solid transparent;border-radius:5px;height:24px;padding:0 6px;gap:6px;min-width:0}
.f:hover{border-color:var(--line)}
.f:focus-within{border-color:var(--accent)}
.f b{color:var(--mute);font-weight:400;min-width:10px;font-size:11px;white-space:nowrap}
.f input,.f select{background:none;border:0;outline:0;width:100%;min-width:0;height:100%;font-variant-numeric:tabular-nums}
.f select option{background:var(--panel)}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid #0000001a;flex:none;position:relative;overflow:hidden;padding:0}
.sw input{position:absolute;inset:-6px;width:30px;height:30px;opacity:0;cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);margin:0}
input[type=range]{accent-color:var(--accent)}
.pgl{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:5px;margin:0 4px;cursor:default}
.pgl:hover{background:var(--hover)}
.pgl.on{font-weight:600}
.pgl .ck{width:12px}
.pgl .act{opacity:0;background:none;border:0;border-radius:4px;width:22px;height:22px;color:var(--fg2);font-size:14px;line-height:1}
.pgl:hover .act,.pgl .act:focus-visible{opacity:1}
.pgl .act:hover{background:var(--line)}
#layers{flex:1;overflow:auto;padding:4px 0 24px}
.lyr{display:flex;align-items:center;gap:4px;height:28px;padding-right:6px;margin:0 4px;border-radius:5px;white-space:nowrap;cursor:default;border:1px solid transparent}
.lyr:hover{border-color:var(--line)}
.lyr.sel{background:var(--accentw)}
.lyr .tw{width:14px;color:var(--mute);text-align:center;flex:none;font-size:8px}
.lyr .ty{color:var(--mute);flex:none;display:flex}
.lyr.comp .ty,.lyr.comp .nm,.lyr.inst .ty,.lyr.inst .nm{color:var(--comp)}
.lyr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext;text-align:left}
.nm,.fname,#htitle{unicode-bidi:plaintext}
.lyr .act{opacity:0;background:none;border:0;color:var(--fg2);width:20px;height:20px;border-radius:4px;display:grid;place-items:center;padding:0}
.lyr .act svg{width:14px;height:14px}
.lyr:hover .act,.lyr .act.on{opacity:1}
.lyr.dim .nm,.lyr.dim .ty{opacity:.4}
.lyr.drop-in{border-color:var(--accent)}
.lyr.drop-a{box-shadow:inset 0 2px 0 var(--accent)}
.lyr.drop-b{box-shadow:inset 0 -2px 0 var(--accent)}
#stage{position:relative;overflow:hidden;background-color:var(--canvas);touch-action:none;outline:0}
#stage,#stage svg,#tabbar,.dock,.lyr,.pgl,#hnav a,.file{-webkit-user-select:none;user-select:none}
#stage #te,#stage #aip textarea,#stage #aip .msg{-webkit-user-select:text;user-select:text}
#stage.dots{background-image:radial-gradient(circle,var(--dot) 1px,transparent 1.3px)}
#cv,#ov{position:absolute;inset:0;width:100%;height:100%}
#ov{pointer-events:none}
#ov [data-h],#ov [data-lbl],#ov [data-pt],#ov [data-guide]{pointer-events:all}
#rul{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#rul [data-ruler]{pointer-events:all}
#stage.t-hand{cursor:grab}#stage.t-draw{cursor:crosshair}#stage.t-text{cursor:text}#stage.t-cmt{cursor:cell}
#te{position:absolute;background:transparent;border:1px solid var(--accent);outline:0;resize:none;overflow:hidden;padding:0;margin:0;unicode-bidi:plaintext;z-index:3;word-break:break-word}
.pin{position:absolute;width:28px;height:28px;border-radius:50% 50% 50% 4px;background:var(--panel);display:grid;place-items:center;font-size:11px;font-weight:600;transform:translate(0,-100%);cursor:pointer;box-shadow:var(--shadow);border:2px solid var(--accent);color:var(--fg)}
.dock{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:4px;display:flex;gap:2px;align-items:center;z-index:5}
.dock button{background:none;border:0;border-radius:8px;width:32px;height:32px;display:grid;place-items:center;color:var(--fg);position:relative}
.dock button:hover{background:var(--hover)}
.dock button.on{background:var(--accent);color:var(--onaccent)}
.dock .car{width:12px;height:32px;border-radius:6px;font-size:8px;color:var(--mute)}
.dock .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.dock .ai{width:auto;padding:0 10px;gap:6px;display:flex;font-weight:500}
.dock .ai.on{background:linear-gradient(135deg,#a259ff,#0d99ff)}
.dock .dev.on{background:var(--dev)}
.dock.top{bottom:auto;top:12px}

const AI_RULES=`You are Claude, working inside Vellum, a vector interface design editor. The person is designing on the canvas and talks to you from a side panel. Each message includes the current canvas context and the selected layers.
How to work:
- If they ask for a change, make it with the tools (update_layers, create_layers, delete_layers, select_layers), then reply in one or two short sentences saying what you changed. If they ask a question, answer briefly without tools.
- The selection is what "this", "these" and "it" refer to. If nothing is selected, the request is about the whole page.
- Layer model: type is frame | rect | ellipse | line | polygon | star | text | path | group | comp | inst. x,y are relative to the parent. Colors are 6-digit hex. Text layers use text, fs (size), fw (weight 400-800), font (Inter, Roboto, Open Sans, Montserrat, Poppins, Rubik, Heebo, Assistant, Noto Sans Hebrew, Playfair Display, Oswald, Space Grotesk, DM Serif Display, JetBrains Mono), fw 100-900, italic true/false, fst (font width keyword such as condensed or expanded), ta (start|center|end), fill (text color); give w to make a wrapping text box. Frames can have auto layout: auto {on:true, dir:"v"|"h", gap, pad (or pt/pr/pb/pl per side), align:"start|center|end|stretch", just:"start|center|end|between", hugW, hugH, wrap, rtl}. Children of auto layout frames take sizeH / sizeV = "fixed" | "hug" | "fill" (fill = fill container) plus optional minW/maxW/minH/maxH. Icons: {type:"path", d:"<SVG path data>", viewBox:24, w:24, h:24, stroke:"#hex", sw:2} or fill. Images: {type:"image", src:"https://…", w, h}. Text inside an instance can be changed with update_layers on its id (it becomes an override). Corner radius is rad. Opacity is op (0-1). Shadow: shadow {on:true,x,y,b,c,o}.
- Name layers in English with clear names (e.g. "Header", "Primary button"). Mobile screens are frames of 390x844 with a white fill; place new screens in the free space given in the context.
- Act like a senior product designer who works autonomously. Do not ask clarifying questions unless you cannot start at all; make sensible assumptions, state them in one short line, and build.
- For a big request (an app, a website, a flow), write a short plan (screens and shared components), then build all of it: each screen is its own top-level frame (mobile 390x844, desktop 1440x1024) placed left to right with 100px gaps starting at the free space in the context. Use auto layout frames for headers, lists, cards, forms and navigation bars; reuse components; use the color variables when they exist; add prototype links (link: id of the destination frame) between screens.
- Build one screen per create_layers call, with all its children nested. Large requests take several steps.
- Quality bar: 8px spacing grid, 16-24px side padding on mobile, a clear type scale (32/24/20/16/14/12), weights 400-700, touch targets at least 44px tall, accessible contrast, realistic content (no lorem ipsum). Draw simple icons with small shapes.
- Hebrew: when the person writes Hebrew, write the interface text in Hebrew, set auto.rtl true on horizontal auto layout rows, and keep ta "start" (Hebrew aligns right automatically).
- End every reply with a last line "STATUS: DONE" when the whole request is complete, or "STATUS: CONTINUE" when more steps are needed. You will then be called again with the updated canvas.
- Websites and landing pages: build each page as a desktop frame (1440 wide) using auto layout for every section (nav, hero, features, footer) so it becomes responsive, link buttons/nav items to other page frames with link, and tell the person they can press Website to publish it.
- Icons: use create_layers with {type:"path", d, viewBox:24, w, h, stroke, sw:2} using Lucide-style 24px stroke paths.
- Reply in the language the person writes in.`;
function applyProps(n,p){const ignored=[];const ok=['sizeH','sizeV','minW','maxW','minH','maxH','src','fit','name','x','y','w','h','rot','fill','fillOn','stroke','strokeOn','sw','dash','rad','op','vis','lock','text','fs','fw','font','ta','lh','ls','italic','upper','deco','fst','blur','shadow','auto','clip','sides','inner','closed','link','absPos','cons','grad','style','arrow','variant'];

function pushPresence(){if(!CAP.room)return;const s=D?topSel():[];CAP.room.presence({file:PID||null,view:D?'editor':'files',fileName:D?String(D.name).slice(0,80):null,page:D?String(page().name).slice(0,80):null,sel:s.slice(0,10).map(n=>({id:n.id,type:n.type,name:String(nm(n)).slice(0,60)}))}).catch(()=>{})}
async function initDesk(){try{CAP.desk.onUpdate&&CAP.desk.onUpdate(info=>{if(document.getElementById('updbar'))return;const b=document.createElement('div');b.id='updbar';b.setAttribute('role','status');b.style.cssText='position:fixed;right:16px;bottom:16px;z-index:9999;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:12px';
  b.innerHTML=`<span>Vellum ${esc(String(info&&info.version||''))} is ready</span><button class="btn pri" id="updgo">Restart to update</button><button class="ib" id="updx" aria-label="Later">✕</button>`;document.body.appendChild(b);
  $('#updgo').onclick=async()=>{try{await CAP.desk.flush()}catch(e){}CAP.desk.installUpdate()};$('#updx').onclick=()=>b.remove()})}catch(e){}const dk=CAP.desk;
  CAP.dl={save:async({filename,data})=>{const buf=data instanceof Blob?new Uint8Array(await data.arrayBuffer()):data;const ok=await dk.saveFile(filename,buf);if(!ok)throw{code:'declined'};return{status:'saved'}}};
  try{const f=await dk.getFolders();if(Array.isArray(f)&&f.length)FOLDERS=f;else if(FOLDERS.length)dk.setFolders(FOLDERS)}catch(e){}
  syncState('All changes saved on this computer','ok');
  try{LOCALFONTS=(await dk.fonts()).filter(f=>!FONTS.includes(f))}catch(e){}
  dk.onCommand(deskCommand);
  window.__vellumFlush=async()=>{if(D&&PID){clearTimeout(saveT);putDoc(PID,D)}await LASTSAVE;await dk.flush()};
  if(!D){FILES=await listFiles();renderHome()}}
/* commands sent by Claude Desktop / Claude Code through the Vellum MCP connector */
async function deskCommand(tool,args){const need=()=>{if(!D)throw new Error('No file is open. Use vellum_open_file or vellum_create_file first.')};
  switch(tool){
    case 'open_file':{const d=await loadDoc(String(args.id));if(!d)throw new Error('No file with id '+args.id);openFile(String(args.id),d);return{opened:d.name,pages:d.pages.map(p=>p.name)}}
    case 'create_file':{createFile('blank');D.name=String(args.name||'Untitled');putDoc(PID,D);layers();return{id:PID,name:D.name}}
    case 'get_canvas':{need();if(args.page){const i=D.pages.findIndex(p=>p.name===args.page);if(i<0)throw new Error('No page named '+args.page);if(i!==D.cur){D.cur=i;UI.sel=[];refresh(false)}}return ctxText()}
    case 'get_selection':{need();return topSel().map(n=>compact(n))}
    case 'update_layers':case 'create_layers':case 'delete_layers':case 'select_layers':case 'add_page':case 'make_component':{need();const t=aiTools().find(x=>x.name===tool);return await t.execute(args,{})}
    case 'snapshot':{need();const ns=(args.ids&&args.ids.length?args.ids.map(String).map(N).filter(Boolean):page().nodes.filter(n=>n.vis));if(!ns.length)throw new Error('Nothing to show on this page');const b=union(ns.map(rbox));const sc=Math.min(2,1600/Math.max(b.w,b.h,1));const bl=await toPng(ns,sc);const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(bl)});return{png:b64}}
    default:throw new Error('Unknown command '+tool)}}
async function connectDialog(){const dk=CAP.desk;if(!dk){toast('Connecting Claude works in the Vellum desktop app');return}const cmd=await dk.claudeCodeCommand();

    <div class="hint" style="font-size:12px;line-height:18px">Claude works on your designs through the Vellum connector (MCP), with your normal Claude account and no extra cost. Keep Vellum open while Claude works.</div>
    <div class="sec" style="padding:0;border:0"><h4>Claude Desktop</h4><div class="hint">Adds Vellum to Claude Desktop. Restart Claude Desktop afterwards, then ask: “In Vellum, design a 4-screen onboarding flow”.</div><button class="btn pri big" id="cc-desk">Connect Claude Desktop</button><div class="hint" id="cc-msg"></div></div>
    <div class="sec" style="padding:0;border:0"><h4>Claude Code</h4><div class="hint">Run this once in a terminal:</div><pre class="code" id="cc-cmd">${esc(cmd)}</pre><button class="btn" data-copy="cc-cmd" id="cc-copy">Copy command</button></div>
    <div class="row"><span class="sp"></span><button class="btn big" id="cc-x">Close</button></div></div>`;document.body.appendChild(m);
  m.addEventListener('click',async e=>{if(e.target===m||e.target.id==='cc-x')m.remove();if(e.target.id==='cc-copy')copyText($('#cc-cmd'));if(e.target.id==='cc-desk'){const r=await dk.connectClaude();$('#cc-msg').textContent=r.ok?'Connected. Restart Claude Desktop to load Vellum.':'Could not connect: '+r.error}})}
async function initCaps(){if(CAP.desk)return initDesk();if(!window.claude?.use)return;const use=n=>window.claude.use(n).catch(()=>null);
  const [dl,user,db,assets,sample,room]=await Promise.all([use('downloads'),use('user'),use('db'),use('assets'),use('sample'),use('room')]);
  CAP.dl=dl;CAP.assets=assets;CAP.sample=sample;CAP.user=user;
  if(sample){try{CAP.limits=await sample.limits()}catch(e){CAP.limits={}}}
  if(user){try{CAP.me=await user.me()}catch(e){}}
  if(user&&db){try{CAP.uid=await user.id()}catch(e){}if(CAP.uid){CAP.db=db;syncState('Synced to your account','ok');
    try{const qs=await db.collection(`data/users/${CAP.uid}`).get();const have=new Set(qs.docs.map(d=>d.id));
      for(const p of readIndex()){if(!have.has('p_'+p.id)){const js=LS.get('cs-doc-'+p.id);if(js){try{const d=JSON.parse(js);await remoteSave(p.id,d,js,p.thumb||'')}catch(e){}}}}
      if(FOLDERS.length&&!have.has('folders'))saveFolders()}catch(e){}}}
  loadChats();
  if(!D){FILES=await listFiles();renderHome()}
  if(room){CAP.room=room;const colors=['#ff7262','#0acf83','#ffc700','#f24e1e','#a259ff','#1abcfe'];const me=CAP.me?.color||colors[Math.floor(Math.random()*colors.length)];
    UI.nick=CAP.me?.name?CAP.me.name.split(' ')[0]:'Guest '+Math.floor(Math.random()*90+10);
    room.presence({color:me,nick:UI.nick,who:{c:me,t:Date.now()}}).catch(()=>{});pushPresence();
    room.onPeers(ch=>{UI.peers=ch.peers;$('#peers').innerHTML=ch.peers.filter(p=>p.kind==='viewer').slice(0,5).map(p=>`<span style="background:${esc(p.presence?.color||'#888')}" title="${esc(p.presence?.nick||'Guest')}${p.sameTab?' (you)':''}">${esc(String(p.presence?.nick||'?').slice(0,1).toUpperCase())}</span>`).join('');if(D)drawOv()},()=>{});checkSend()}
}
