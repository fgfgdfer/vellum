name: Build Windows installer
# Push a tag such as v0.4.0 to build the installer and publish a release.
# Installed copies of Vellum check these releases and update themselves.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and publish the installer with update info
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx electron-builder --win nsis
          --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
          -c.publish.provider=github
          -c.publish.owner=${{ github.repository_owner }}
          -c.publish.repo=${{ github.event.repository.name }}
          -c.publish.releaseType=release
      - uses: actions/upload-artifact@v4
        with:
          name: Vellum-Windows-installer
          path: |
            dist/*.exe
            dist/latest.yml
