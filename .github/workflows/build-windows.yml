name: Build Windows installer
# Every push to main builds the Windows installer and publishes it as release v<version from package.json>.
# Installed copies of Vellum check these releases and update themselves.
# Raise "version" in package.json to ship a new update.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-windows
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and publish the installer with update info
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx electron-builder --win nsis --x64
          --publish always
          -c.publish.provider=github
          -c.publish.owner=${{ github.repository_owner }}
          -c.publish.repo=${{ github.event.repository.name }}
          -c.publish.releaseType=release
      - uses: actions/upload-artifact@v4
        with:
          name: Vellum-Windows-installer
          path: |
            dist/*.exe
            dist/latest.yml
